services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health_local_only
      POSTGRES_DB: health
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - health_pg_data:/var/lib/postgresql/data

volumes:
  health_pg_data:
